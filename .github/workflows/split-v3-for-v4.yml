name: Split v3 artifact for v4 rebuild

on:
  push:
    branches:
      - codex/eplan-port
    paths:
      - .github/workflows/split-v3-for-v4.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/eplan-port

      - name: Download v3 artifact
        uses: actions/download-artifact@v4
        with:
          name: cad-libraries-no-login-v3-3
          path: v3-cache
          github-token: ${{ github.token }}
          repository: sunyu1235/sunyu1235-eplan-codex-skill
          run-id: 32559449548

      - name: Pack and split v3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p parts
          tar -cf - v3-cache | split -b 300M -d -a 2 - parts/v3-cache.tar.part-
          ls -lh parts
          sha256sum parts/* > parts/SHA256SUMS.txt
          cat parts/SHA256SUMS.txt

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-part-00
          path: parts/v3-cache.tar.part-00
          compression-level: 0
          retention-days: 7

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-part-01
          path: parts/v3-cache.tar.part-01
          compression-level: 0
          retention-days: 7

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-part-02
          path: parts/v3-cache.tar.part-02
          compression-level: 0
          retention-days: 7

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-part-03
          path: parts/v3-cache.tar.part-03
          compression-level: 0
          retention-days: 7

      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-part-04
          path: parts/v3-cache.tar.part-04
          compression-level: 0
          retention-days: 7

      - name: Upload part 05
        if: ${{ hashFiles('parts/v3-cache.tar.part-05') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-part-05
          path: parts/v3-cache.tar.part-05
          compression-level: 0
          retention-days: 7

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: v3-split-checksums
          path: parts/SHA256SUMS.txt
          retention-days: 7
