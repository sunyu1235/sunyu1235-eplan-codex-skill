name: Probe v4 CAD direct links

on:
  pull_request:
    branches:
      - codex/eplan-port
    paths:
      - v4-cad-probe.trigger
      - .github/workflows/probe-v4-cad-direct-links.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call Siemens image variant API
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import requests, xml.etree.ElementTree as ET, re
          base='https://www.automation.siemens.com/bilddb/interfaces/InterfaceImageDB.asmx'
          motifs=['G_ST70_XX_91616','G_ST70_XX_91624','G_ST70_XX_91629','G_ST70_XX_93827']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'*/*'})

          def get(path, params):
            r=s.get(base+'/'+path,params=params,timeout=60,allow_redirects=True)
            print('GET',path,r.status_code,r.url,'type',r.headers.get('content-type'),'len',len(r.content),'first',r.content[:80])
            return r

          # Variant type catalogue: discover STEP ID instead of guessing.
          r=get('GetImageVariantTypeList',{'interfaceuserid':''})
          print('TYPE_XML',r.text[:20000])

          for m in motifs:
            print('=== VARIANTS',m,'===')
            r=get('GetImageVariantList',{'objectkey':m,'interfaceuserid':''})
            print('VARIANT_XML',r.text[:30000])
            if r.status_code != 200: continue
            try:
              root=ET.fromstring(r.content)
            except Exception as e:
              print('XMLERR',m,e); continue
            variants=[]
            for obj in root.iter():
              if obj.tag.split('}')[-1]=='ImageVariantObject':
                d={c.tag.split('}')[-1]:(c.text or '') for c in obj}
                variants.append(d)
            print('PARSED',m,variants)
            for v in variants:
              ext=(v.get('FileExtension') or '').lower()
              name=(v.get('Filename') or '').lower()
              if 'stp' in ext or 'step' in ext or name.endswith(('.stp','.step')):
                vid=v.get('ImageVariantID','')
                for api in ['GetImageVariantExt','GetImageVariant']:
                  rr=get(api,{'objectkey':m,'imagevariantid':vid,'lang':'','interfaceuserid':''})
                  print('DOWNLOAD_RESULT',m,vid,api,rr.status_code,rr.url,rr.headers.get('content-disposition'),rr.headers.get('content-type'),len(rr.content),rr.content[:40])
          PY
