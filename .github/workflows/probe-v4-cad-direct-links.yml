name: Probe v4 CAD direct links

on:
  pull_request:
    branches:
      - codex/eplan-port
    paths:
      - v4-cad-probe.trigger
      - .github/workflows/probe-v4-cad-direct-links.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Siemens direct STEP paths
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import requests
          motifs=['G_ST70_XX_91616','G_ST70_XX_91624','G_ST70_XX_91629','G_ST70_XX_93827']
          bases=[
            'https://www.automation.siemens.com/bilddb/ivariant/ST70/{f}',
            'https://www.automation.siemens.com/bilddb/original/ST70/{f}',
            'https://www.automation.siemens.com/bilddb/ori/ST70/{f}',
            'https://www.automation.siemens.com/bilddb/download/ST70/{f}',
            'https://www.automation.siemens.com/bilddb/Download/ST70/{f}',
          ]
          names=['{m}V.stp','{m}v.stp','{m}.stp','{m}V.STP','{m}.zip']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          for m in motifs:
            print('===',m,'===')
            for base in bases:
              for pat in names:
                f=pat.format(m=m); u=base.format(f=f)
                try:
                  r=s.get(u,timeout=20,stream=True,allow_redirects=True)
                  first=next(r.iter_content(96),b'')
                  ok=(r.status_code==200 and (first.startswith(b'ISO-10303-21') or first.startswith(b'PK')))
                  if ok or r.status_code not in (404,403):
                    print('TRY',r.status_code,'OK' if ok else 'NO',u,'final',r.url,'len',r.headers.get('content-length'),'type',r.headers.get('content-type'),'first',first[:60])
                  r.close()
                except Exception as e:
                  print('ERR',u,repr(e))
          PY

      - name: Probe object-key detail pages
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import requests,re,html
          motifs=['G_ST70_XX_91616','G_ST70_XX_91624','G_ST70_XX_91629','G_ST70_XX_93827']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'})
          for m in motifs:
            u='https://www.automation.siemens.com/bilddb/index.aspx?objKey='+m
            r=s.get(u,timeout=30,allow_redirects=True)
            print('DETAIL',m,r.status_code,r.url,'bytes',len(r.content))
            t=r.text
            for v in re.findall(r'(?:href|src|value)=["\']([^"\']+)["\']',t,re.I):
              vv=html.unescape(v)
              if m in vv or any(x in vv.lower() for x in ['.stp','.step','.jt','.zip','download.ashx','downloadfile']):
                print('LINK',m,vv)
            for x in re.findall(r'.{0,300}(?:'+re.escape(m)+r'|\.stp|\.step|\.jt|download).{0,700}',t,re.I|re.S):
              print('CTX',m,re.sub(r'\s+',' ',x)[:2000])
          PY
